name: Validate directory proposal

on:
  push:
    branches: [validation/chainlove-directory]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the directory's link report
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md
          fail: false
      - name: Require the added URL to pass
        run: |
          printf '%s\n' '[Chain.Love](https://www.chain.love/)' > /tmp/chainlove-added-link.md
          lychee --verbose --no-progress /tmp/chainlove-added-link.md
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: directory-link-report
          path: lychee/out.md
